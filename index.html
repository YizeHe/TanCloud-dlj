<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tan云科技增值短网址域名。请前往主站 cloud.tanstudio.me 购买使用。">
  <title>Tan云短链 · 增值域名</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img class="bg-photo" src="bg.jpg" alt="" decoding="async">
  <div class="bg-fallback" aria-hidden="true"></div>
  <div class="bg-scrim" aria-hidden="true"></div>

  <main class="page">
    <article
      class="card lg-surface lg-glare"
      id="main-card"
      data-glass
      data-glass-opts='{"scale":-110,"mapBlur":12,"blur":3}'
    >
      <p class="kicker">Tan云科技</p>
      <h1>增值短网址域名</h1>

        如需购买或使用短链服务，请前往主站办理。
      </p>
      <a
        class="btn btn-primary lg-surface"
        href="https://cloud.tanstudio.me"
        target="_blank"
        rel="noopener noreferrer"
        data-glass
        data-glass-opts='{"scale":-90,"mapBlur":10,"blur":2}'
      >
        前往主站 cloud.tanstudio.me
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </a>
      <p class="foot">cloud.tanstudio.me</p>
    </article>
  </main>

  <script src="liquid-glass.js"></script>
  <script src="app.js"></script>

</html>
